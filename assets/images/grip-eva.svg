<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="eva" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454545"/>
      <stop offset="50%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#303030"/>
    </linearGradient>
    <filter id="foam">
      <feTurbulence type="turbulence" baseFrequency="3" numOctaves="5" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="soft-light"/>
    </filter>
    <radialGradient id="glow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect x="50" y="60" width="300" height="160" rx="20" fill="url(#eva)" filter="url(#foam)"/>
  <rect x="50" y="60" width="300" height="160" rx="20" fill="url(#glow)"/>
  <!-- Dense foam dots -->
  <circle cx="90" cy="100" r="1.5" fill="#505050" opacity="0.5"/>
  <circle cx="130" cy="85" r="1" fill="#505050" opacity="0.4"/>
  <circle cx="170" cy="110" r="1.5" fill="#505050" opacity="0.5"/>
  <circle cx="210" cy="90" r="1" fill="#505050" opacity="0.4"/>
  <circle cx="250" cy="105" r="1.5" fill="#505050" opacity="0.5"/>
  <circle cx="290" cy="80" r="1" fill="#505050" opacity="0.4"/>
  <circle cx="110" cy="140" r="1" fill="#505050" opacity="0.4"/>
  <circle cx="150" cy="155" r="1.5" fill="#505050" opacity="0.5"/>
  <circle cx="190" cy="135" r="1" fill="#505050" opacity="0.4"/>
  <circle cx="230" cy="160" r="1.5" fill="#505050" opacity="0.5"/>
  <circle cx="270" cy="145" r="1" fill="#505050" opacity="0.4"/>
  <circle cx="310" cy="130" r="1.5" fill="#505050" opacity="0.5"/>
  <circle cx="100" cy="180" r="1" fill="#505050" opacity="0.4"/>
  <circle cx="200" cy="185" r="1.5" fill="#505050" opacity="0.5"/>
  <circle cx="300" cy="175" r="1" fill="#505050" opacity="0.4"/>
  <text x="200" y="270" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">EVA FOAM GRIP</text>
</svg>