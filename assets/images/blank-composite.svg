<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="composite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a40"/>
      <stop offset="30%" stop-color="#3e3e36"/>
      <stop offset="70%" stop-color="#333330"/>
      <stop offset="100%" stop-color="#2a2a26"/>
    </linearGradient>
    <pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#363632"/>
      <path d="M0,0 L6,6 L12,0" fill="none" stroke="#4a4a42" stroke-width="0.6"/>
      <path d="M0,6 L6,12 L12,6" fill="none" stroke="#3a5a3a" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Rod blank section -->
  <rect x="30" y="110" width="340" height="80" rx="8" fill="url(#composite)"/>
  <!-- Mixed weave pattern -->
  <rect x="30" y="110" width="340" height="80" rx="8" fill="url(#weave)" opacity="0.5"/>
  <!-- Sheen -->
  <rect x="30" y="110" width="340" height="40" rx="8" fill="url(#sheen)"/>
  <!-- Tapered ends -->
  <polygon points="30,110 20,125 20,175 30,190" fill="#1a1a1a"/>
  <polygon points="370,110 380,120 380,180 370,190" fill="#1a1a1a"/>
  <!-- Carbon diagonal lines -->
  <line x1="60" y1="112" x2="95" y2="188" stroke="#444" stroke-width="0.5" opacity="0.35"/>
  <line x1="120" y1="112" x2="155" y2="188" stroke="#444" stroke-width="0.5" opacity="0.35"/>
  <line x1="180" y1="112" x2="215" y2="188" stroke="#444" stroke-width="0.5" opacity="0.35"/>
  <line x1="240" y1="112" x2="275" y2="188" stroke="#444" stroke-width="0.5" opacity="0.35"/>
  <line x1="300" y1="112" x2="335" y2="188" stroke="#444" stroke-width="0.5" opacity="0.35"/>
  <!-- Glass fiber lines (greenish tint) -->
  <line x1="95" y1="188" x2="60" y2="112" stroke="#4a6a4a" stroke-width="0.5" opacity="0.25"/>
  <line x1="155" y1="188" x2="120" y2="112" stroke="#4a6a4a" stroke-width="0.5" opacity="0.25"/>
  <line x1="215" y1="188" x2="180" y2="112" stroke="#4a6a4a" stroke-width="0.5" opacity="0.25"/>
  <line x1="275" y1="188" x2="240" y2="112" stroke="#4a6a4a" stroke-width="0.5" opacity="0.25"/>
  <line x1="335" y1="188" x2="300" y2="112" stroke="#4a6a4a" stroke-width="0.5" opacity="0.25"/>
  <text x="200" y="260" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">COMPOSITE BLANK</text>
</svg>