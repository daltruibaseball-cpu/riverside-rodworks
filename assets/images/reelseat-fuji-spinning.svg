<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="30%" stop-color="#6e6e6e"/>
      <stop offset="70%" stop-color="#5a5a5a"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
  </defs>
  <!-- Main reel seat body -->
  <rect x="80" y="115" width="240" height="70" rx="10" fill="url(#metal)"/>
  <!-- Reel foot slot -->
  <rect x="140" y="120" width="120" height="12" rx="3" fill="#333" opacity="0.8"/>
  <!-- Hood / locking nut (left) -->
  <rect x="70" y="110" width="40" height="80" rx="8" fill="url(#gunmetal)" stroke="#666" stroke-width="0.5"/>
  <!-- Thread lines on locking nut -->
  <line x1="75" y1="120" x2="105" y2="120" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="75" y1="128" x2="105" y2="128" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="75" y1="136" x2="105" y2="136" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="75" y1="144" x2="105" y2="144" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="75" y1="152" x2="105" y2="152" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="75" y1="160" x2="105" y2="160" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="75" y1="168" x2="105" y2="168" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="75" y1="176" x2="105" y2="176" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="75" y1="184" x2="105" y2="184" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <!-- Fixed hood (right) -->
  <rect x="290" y="112" width="35" height="76" rx="8" fill="url(#gunmetal)" stroke="#666" stroke-width="0.5"/>
  <!-- Rod blank extending -->
  <rect x="30" y="145" width="50" height="10" rx="5" fill="#2a2a2a"/>
  <rect x="320" y="145" width="50" height="10" rx="5" fill="#2a2a2a"/>
  <!-- Highlight line -->
  <line x1="110" y1="118" x2="290" y2="118" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="200" y="270" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">FUJI DPS SPINNING REEL SEAT</text>
</svg>