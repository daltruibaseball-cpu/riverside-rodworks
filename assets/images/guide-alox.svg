<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="50%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <linearGradient id="alox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a8a7a"/>
      <stop offset="50%" stop-color="#b0a090"/>
      <stop offset="100%" stop-color="#9a8a7a"/>
    </linearGradient>
  </defs>
  <!-- Guide frame legs -->
  <line x1="170" y1="220" x2="190" y2="170" stroke="url(#steel)" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="220" x2="210" y2="170" stroke="url(#steel)" stroke-width="3" stroke-linecap="round"/>
  <!-- Guide ring frame (outer) -->
  <circle cx="200" cy="130" r="55" fill="none" stroke="url(#steel)" stroke-width="4"/>
  <!-- Aluminum oxide insert ring -->
  <circle cx="200" cy="130" r="45" fill="none" stroke="url(#alox)" stroke-width="6"/>
  <!-- Inner opening -->
  <circle cx="200" cy="130" r="38" fill="#0f1419"/>
  <!-- Highlight on ring -->
  <path d="M165,100 A45,45 0 0,1 235,100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Frame foot -->
  <rect x="165" y="218" width="70" height="8" rx="4" fill="url(#steel)"/>
  <!-- Rod blank at base -->
  <rect x="100" y="220" width="200" height="10" rx="5" fill="#2a2a2a"/>
  <text x="200" y="275" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">ALUMINUM OXIDE GUIDE</text>
</svg>