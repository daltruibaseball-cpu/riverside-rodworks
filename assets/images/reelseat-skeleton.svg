<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a7a7a"/>
      <stop offset="50%" stop-color="#5e5e5e"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
  </defs>
  <!-- Exposed blank through skeleton cutout -->
  <rect x="60" y="142" width="280" height="16" rx="8" fill="#1e1e1e"/>
  <!-- Skeleton frame - top rail -->
  <rect x="90" y="115" width="220" height="8" rx="4" fill="url(#metal)"/>
  <!-- Skeleton frame - bottom rail -->
  <rect x="90" y="177" width="220" height="8" rx="4" fill="url(#metal)"/>
  <!-- Skeleton frame - left upright -->
  <rect x="90" y="115" width="8" height="70" rx="4" fill="url(#metal)"/>
  <!-- Skeleton frame - right upright -->
  <rect x="302" y="115" width="8" height="70" rx="4" fill="url(#metal)"/>
  <!-- Center support -->
  <rect x="196" y="115" width="8" height="70" rx="4" fill="url(#metal)"/>
  <!-- Cutout windows (dark showing blank) -->
  <rect x="102" y="126" width="90" height="48" rx="6" fill="#151a1f" stroke="#555" stroke-width="0.5"/>
  <rect x="208" y="126" width="90" height="48" rx="6" fill="#151a1f" stroke="#555" stroke-width="0.5"/>
  <!-- End hoods -->
  <rect x="55" y="120" width="40" height="60" rx="10" fill="url(#metal)" stroke="#666" stroke-width="0.5"/>
  <rect x="305" y="120" width="40" height="60" rx="10" fill="url(#metal)" stroke="#666" stroke-width="0.5"/>
  <!-- Rod blank extending -->
  <rect x="20" y="142" width="40" height="16" rx="8" fill="#1e1e1e"/>
  <rect x="340" y="142" width="40" height="16" rx="8" fill="#1e1e1e"/>
  <text x="200" y="270" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">SKELETON REEL SEAT</text>
</svg>