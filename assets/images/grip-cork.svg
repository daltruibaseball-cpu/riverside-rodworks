<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="cork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="30%" stop-color="#c4956a"/>
      <stop offset="70%" stop-color="#b8875c"/>
      <stop offset="100%" stop-color="#a67848"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="2" numOctaves="6" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Close-up cork texture block -->
  <rect x="50" y="60" width="300" height="160" rx="20" fill="url(#cork)" filter="url(#grain)"/>
  <rect x="50" y="60" width="300" height="160" rx="20" fill="url(#glow)"/>
  <!-- Cork pore marks -->
  <circle cx="120" cy="110" r="3" fill="#96703e" opacity="0.4"/>
  <circle cx="180" cy="130" r="2" fill="#96703e" opacity="0.3"/>
  <circle cx="250" cy="100" r="4" fill="#96703e" opacity="0.35"/>
  <circle cx="300" cy="150" r="2.5" fill="#96703e" opacity="0.3"/>
  <circle cx="140" cy="170" r="3" fill="#96703e" opacity="0.4"/>
  <circle cx="220" cy="160" r="2" fill="#96703e" opacity="0.35"/>
  <circle cx="280" cy="120" r="3.5" fill="#96703e" opacity="0.3"/>
  <circle cx="100" cy="145" r="2" fill="#96703e" opacity="0.4"/>
  <circle cx="200" cy="90" r="2.5" fill="#96703e" opacity="0.35"/>
  <circle cx="160" cy="85" r="1.5" fill="#96703e" opacity="0.3"/>
  <circle cx="320" cy="100" r="2" fill="#96703e" opacity="0.3"/>
  <circle cx="270" cy="180" r="3" fill="#96703e" opacity="0.35"/>
  <text x="200" y="270" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">PREMIUM CORK GRIP</text>
</svg>