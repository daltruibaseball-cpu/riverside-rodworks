<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="cork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="50%" stop-color="#b8875c"/>
      <stop offset="100%" stop-color="#a67848"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Rod blank full length -->
  <rect x="20" y="145" width="360" height="10" rx="5" fill="#2a2a2a"/>
  <!-- Rear cork grip -->
  <rect x="50" y="120" width="110" height="60" rx="12" fill="url(#cork)"/>
  <rect x="50" y="120" width="110" height="30" rx="12" fill="url(#highlight)"/>
  <!-- Exposed blank in middle -->
  <rect x="160" y="140" width="80" height="20" rx="5" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <!-- Front cork grip -->
  <rect x="240" y="120" width="110" height="60" rx="12" fill="url(#cork)"/>
  <rect x="240" y="120" width="110" height="30" rx="12" fill="url(#highlight)"/>
  <!-- End caps -->
  <rect x="42" y="126" width="14" height="48" rx="4" fill="#7a6244"/>
  <rect x="344" y="126" width="14" height="48" rx="4" fill="#7a6244"/>
  <text x="200" y="270" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">SPLIT GRIP HANDLE</text>
</svg>