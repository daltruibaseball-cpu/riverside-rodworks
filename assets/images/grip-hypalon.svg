<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="hypalon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="50%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <radialGradient id="sheen" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Close-up hypalon block -->
  <rect x="50" y="60" width="300" height="160" rx="20" fill="url(#hypalon)"/>
  <rect x="50" y="60" width="300" height="160" rx="20" fill="url(#sheen)"/>
  <!-- Ribbed texture lines -->
  <line x1="80" y1="60" x2="80" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="60" x2="100" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="60" x2="120" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="140" y1="60" x2="140" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="160" y1="60" x2="160" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="180" y1="60" x2="180" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="60" x2="200" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="220" y1="60" x2="220" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="240" y1="60" x2="240" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="260" y1="60" x2="260" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="280" y1="60" x2="280" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="300" y1="60" x2="300" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <line x1="320" y1="60" x2="320" y2="220" stroke="#383838" stroke-width="1.5" opacity="0.6"/>
  <text x="200" y="270" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">HYPALON RUBBER GRIP</text>
</svg>