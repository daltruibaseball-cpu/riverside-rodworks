<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a7a7a"/>
      <stop offset="50%" stop-color="#5e5e5e"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
  </defs>
  <!-- Main reel seat body -->
  <rect x="90" y="110" width="220" height="65" rx="10" fill="url(#metal)"/>
  <!-- Reel foot slot -->
  <rect x="140" y="115" width="120" height="10" rx="3" fill="#333" opacity="0.8"/>
  <!-- Trigger grip underneath -->
  <path d="M180,175 Q185,175 190,180 L200,210 Q202,218 198,220 L185,220 Q180,218 182,210 L175,185 Q176,178 180,175 Z" fill="url(#gunmetal)" stroke="#666" stroke-width="0.5"/>
  <!-- Hoods -->
  <rect x="80" y="106" width="35" height="73" rx="8" fill="url(#gunmetal)" stroke="#666" stroke-width="0.5"/>
  <rect x="285" y="106" width="35" height="73" rx="8" fill="url(#gunmetal)" stroke="#666" stroke-width="0.5"/>
  <!-- Rod blank -->
  <rect x="30" y="138" width="55" height="10" rx="5" fill="#2a2a2a"/>
  <rect x="315" y="138" width="55" height="10" rx="5" fill="#2a2a2a"/>
  <!-- Highlight -->
  <line x1="115" y1="113" x2="285" y2="113" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="200" y="270" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">FUJI CASTING REEL SEAT</text>
</svg>