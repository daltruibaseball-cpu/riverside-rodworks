<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="cork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="50%" stop-color="#b8875c"/>
      <stop offset="100%" stop-color="#a67848"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Rod blank extending left/right -->
  <rect x="20" y="145" width="360" height="10" rx="5" fill="#2a2a2a"/>
  <!-- Full cork handle -->
  <rect x="60" y="118" width="280" height="64" rx="12" fill="url(#cork)" filter="url(#grain)"/>
  <rect x="60" y="118" width="280" height="32" rx="12" fill="url(#highlight)"/>
  <!-- End cap left -->
  <rect x="52" y="124" width="14" height="52" rx="4" fill="#7a6244"/>
  <!-- End cap right / winding check -->
  <rect x="334" y="124" width="14" height="52" rx="4" fill="#7a6244"/>
  <!-- Cork texture lines -->
  <line x1="120" y1="122" x2="120" y2="178" stroke="#a06e40" stroke-width="0.5" opacity="0.3"/>
  <line x1="180" y1="122" x2="180" y2="178" stroke="#a06e40" stroke-width="0.5" opacity="0.3"/>
  <line x1="240" y1="122" x2="240" y2="178" stroke="#a06e40" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="122" x2="300" y2="178" stroke="#a06e40" stroke-width="0.5" opacity="0.3"/>
  <!-- Label -->
  <text x="200" y="270" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="2">FULL CORK HANDLE</text>
</svg>